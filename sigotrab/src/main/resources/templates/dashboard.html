<!-- templates/dashboard.html -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Panel — SIGO</title></head>
<body>
<main id="contenido" class="app-main container">
  <div class="masthead">
    <div>
      <h1 class="mb-1">
        Bienvenido,
        <span th:text="${#authentication.name}">Usuario</span>
      </h1>
      <p class="text-body-secondary mb-0">Registro de ofertas de SIGO.</p>
    </div>
    <div class="masthead__actions">
      <a class="btn btn-primary btn-sm" th:href="@{/offers}">Ver ofertas</a>
    </div>
  </div>
</main>
</body>
</html>
